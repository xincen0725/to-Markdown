[project]
name = "to-markdown"
version = "1.0.0"
description = "多源输入转结构化Markdown笔记，专为知识管理设计"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "structlog>=23.0.0",
    "pymupdf>=1.23.0",
    "yt-dlp>=2023.0.0",
    "openai>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "Pillow>=10.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "opencv-python>=4.8.0",
]
mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
to-markdown = "src.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
