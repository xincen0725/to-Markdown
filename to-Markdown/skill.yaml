name: to-Markdown
version: "1.0.0"
description: >
  多源输入转结构化 Markdown 笔记，专为知识管理设计。
  支持 PDF、视频（YouTube/Bilibili）、音频、网页转结构化笔记。
  支持繁体竖排 OCR、SOP 提取、批量处理、断点续传、Obsidian 集成。

author: to-Markdown Team
license: MIT

# 入口点
entry:
  cli: src.main:app
  api: src.main:ToMarkdown
  mcp: src.mcp.server:MCPServer

# ─── 自举依赖系统 ───
# 技能内置依赖管理器（src/bootstrap.py），首次使用时自动安装缺失依赖。
# 核心架构（Schema、状态机、断点续传、重试引擎）零外部依赖，基于 Python 标准库。
# 重型库按需懒加载：
#   - 导入 Schema/核心 → 零依赖，即时可用
#   - PDF 处理 → 自动安装 pymupdf
#   - OCR → 自动安装 pytesseract + opencv-python + Pillow
#   - 视频 → 自动安装 yt-dlp
#   - 网页 → 自动安装 httpx + beautifulsoup4 + lxml
#   - AI 总结 → 自动安装 openai
#   - CLI → 自动安装 typer + rich
#   - MCP → 自动安装 mcp
bootstrap:
  enabled: true
  lazy_import: true       # 懒加载模式，仅在使用时安装
  auto_install: true      # 缺失时自动 pip install
  zero_dep_core:          # 核心层零依赖
    - schemas (Pydantic — 内置声明式校验)
    - state_machine
    - checkpoint
    - retry_engine
    - anticorruption
  dep_groups:
    pdf:
      packages: [pymupdf>=1.23.0]
      triggers: [pdf_to_note, sop_extract]
    ocr:
      packages: [pytesseract>=0.3.10, opencv-python>=4.8.0, Pillow>=10.0.0]
      triggers: [ocr_enabled=true]
      external_deps: [tesseract-ocr]
    video:
      packages: [yt-dlp>=2023.0.0]
      triggers: [video_to_note]
    web:
      packages: [httpx>=0.25.0, beautifulsoup4>=4.12.0, lxml>=4.9.0]
      triggers: [web_to_note]
    ai:
      packages: [openai>=1.0.0]
      triggers: [video_to_note, audio_to_note]
    cli:
      packages: [typer>=0.9.0, rich>=13.0.0]
      triggers: [cli_entry]
    mcp:
      packages: [mcp>=1.0.0]
      triggers: [mcp_server]

# 外部系统依赖（需用户手动安装一次）
external_deps:
  tesseract:
    description: OCR 引擎
    macos: brew install tesseract
    ubuntu: apt install tesseract-ocr
    windows: https://github.com/UB-Mannheim/tesseract/wiki
  ffmpeg:
    description: 音视频处理
    macos: brew install ffmpeg
    ubuntu: apt install ffmpeg
    windows: https://ffmpeg.org/download.html

# 能力声明
capabilities:
  - id: pdf-to-note
    name: PDF 转笔记
    description: 将 PDF 文档转化为结构化 Markdown 笔记
    inputs:
      - path: PDF 文件或文件夹路径
      - pages_per_chunk: 分块页数
      - ocr_enabled: 是否启用 OCR
    features:
      - 单个 PDF 处理
      - 文件夹批量处理
      - 繁体竖排 OCR 支持
      - 断点续传
      - 自定义输出目录

  - id: sop-extract
    name: SOP 提取
    description: 从 PDF 文档提取标准操作流程
    inputs:
      - path: PDF 文件或文件夹路径
      - merge_existing: 重新合并已提取的 SOP
    features:
      - 自动识别步骤序号
      - 决策点与分支提取
      - Mermaid 流程图生成
      - 批量提取
      - 断点续传

  - id: video-to-note
    name: 视频转笔记
    description: 将视频内容转化为结构化笔记
    inputs:
      - url: 视频 URL
      - source: 来源 (youtube/bilibili/url/file)
    features:
      - YouTube 支持（字幕优先）
      - Bilibili 支持（API 字幕）
      - 无字幕时音频转录
      - 本地视频文件处理
      - 断点续传

  - id: audio-to-note
    name: 音频转笔记
    description: 将音频文件转录并总结为笔记
    inputs:
      - path: 音频文件或文件夹路径
      - language: 语言代码
    features:
      - 支持 mp3/wav/m4a/ogg/flac/wma
      - 批量音频文件夹处理
      - 转录 + AI 总结
      - 断点续传

  - id: web-to-note
    name: 网页转笔记
    description: 将网页内容转化为结构化笔记
    inputs:
      - url: 网页 URL
      - extract_main: 仅提取正文
    features:
      - 正文提取（去除导航/广告）
      - 结构化总结
      - 来源标注

  - id: batch-convert
    name: 批量转换
    description: 并发批量处理多个转换任务
    features:
      - 并发控制
      - 单任务失败不影响其他
      - 统一结果汇总

# 配置示例
config:
  output_dir: "./output"
  checkpoint_dir: ".checkpoints"
  max_concurrency: 4
  retry:
    max_retries: 3
    base_delay_seconds: 1.0
    max_delay_seconds: 60.0
    timeout_seconds: 300.0
  ocr:
    language: "chi_tra+chi_sim+eng"
    dpi: 300
    direction: "auto"

# MCP 工具列表
mcp_tools:
  - convert_pdf
  - convert_video
  - convert_audio
  - convert_web
  - extract_sop
  - batch_convert

# 断点续传
checkpoint:
  enabled: true
  directory: ".checkpoints"
  format: json
  retention_days: 30
